name: Release — Tag & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Zip dist for release
        run: |
          cd dist
          zip -r ../khata-ghar-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: khata-ghar-${{ github.ref_name }}.zip
          prerelease: true
          body: |
            ## KhataGHAR ${{ github.ref_name }} — Sovereign Wealth Operating System

            ### 🚀 What's New in ${{ github.ref_name }}
            - 📁 **Universal Multi-Attachment Engine Everywhere**: Attach multiple receipts, deeds, agreements, IOUs, bank passbooks, and goal brochures directly to any Transaction, Asset, Liability / Loan, Savings Goal, People Ledger Entry, or Account.
            - 🗄️ **Central Document & Attachment Hub**: Sovereign encrypted file manager with pre-built system folders (Receipts, Deeds, Loans, People, Bank, Tax, Unfiled) and custom folders with custom colors and emoji icons.
            - ⚡ **Two-Tier Split-Payload Storage Architecture**: Sub-second vault unlock (< 50ms) and ultra-low RAM footprint (< 30MB) across 1,000+ attachments by separating searchable metadata from heavy binary blobs (lazy-loaded on demand).
            - 🔗 **Dual-Directional Entity Linking**: Attach files inside any modal or link/unlink existing files across multiple entries directly from the Document Hub.
            - 🎛️ **Smart Optimized vs. Original RAW**: Toggle between smart client-side 1080p compression and bit-exact uncompressed raw file storage.
            - 🔍 **Sub-5ms Instant Search & Filter**: High-speed full-text search across attachment names, notes, and tags with entity filters and dual view modes (Visual Gallery Grid & Dense List Table).
            - 🖼️ **Interactive Lightbox Document Viewer**: Preview images and PDFs with smooth pan/zoom, 90-degree rotation, folder mover, and sovereign export.
            - 🎯 **Hero Card Real-Time Reactivity**: Instant live balance calculations down to the single paisa for every entry without freezing.
            - 💎 **First-Class Asset Redemption & Debt Payoff**: Dedicated redemption tab with NAV calculations and one-click loan payoffs.
            - 📱 **Android In-Place Update Fix**: Continuous release signatures (v1, v2, v3) with persistent keystore ensuring seamless updates over existing installations.

            ### 📦 Direct Downloads
            - **Android APK**: Attached below as `KhataGHAR-Android-${{ github.ref_name }}.apk`
            - **Windows**: Setup & Portable `.exe` executables attached below
            - **Linux**: AppImage, Debian `.deb`, and `tar.gz` packages attached below
            - **macOS**: DMG & ZIP packages attached below
            - **Web Static PWA**: `khata-ghar-${{ github.ref_name }}.zip` (extract and open `index.html`)

            *See [CHANGELOG.md](https://github.com/Krrish1411/KhataGHAR/blob/main/CHANGELOG.md) for complete technical commit history.*
