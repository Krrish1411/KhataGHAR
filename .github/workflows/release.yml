name: Release — Tag & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Zip dist for release
        run: |
          cd dist
          zip -r ../khata-ghar-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: khata-ghar-${{ github.ref_name }}.zip
          prerelease: true
          body: |
            ## KhataGHAR ${{ github.ref_name }} — Sovereign Wealth Operating System

            ### 🚀 What's New in ${{ github.ref_name }}
            - 🎨 **Brand Identity Overhaul**: Complete multi-platform native icon suite for Windows (multi-res ICO 16-256px), macOS (ICNS 16-1024px), Linux (PNGs 16-512px), Android Adaptive Launcher (#1c263e backdrop), and Web PWA.
            - ⚡ **Global Dynamic P2P Sync Engine**: Duplex background sync listener directly in VaultContext, echo loop prevention, and Master Device reset selection.
            - 🔔 **Native Scheduled Reminders**: High-importance notifications channel with customizable lead times (1-7 days before) on bills and goals.
            - 🧮 **Financial Calculators Suite**: 6 institutional calculators (SIP, Step-Up, Lumpsum, SWP, FIRE Runway, Loan Schedule with full Amortization & Prepayments) starting from 0% baseline.
            - ⚖️ **Reconciliation Diff Modal**: Side-by-side stored vs ledger balance comparison with selective per-account reconciliation and demo data safety guard.
            - 📱 **Lifelog Mobile Parity**: Safe area insets, native status bar synchronization, hardware back button routing, tactile haptics, and AST Markdown Notes parser.

            ### 📦 Direct Downloads
            - **Android APK**: Attached below as `KhataGHAR-Android-${{ github.ref_name }}.apk`
            - **Windows**: Setup & Portable `.exe` executables attached below
            - **Linux**: AppImage, Debian `.deb`, and `tar.gz` packages attached below
            - **macOS**: DMG & ZIP packages attached below
            - **Web Static PWA**: `khata-ghar-${{ github.ref_name }}.zip` (extract and open `index.html`)

            *See [CHANGELOG.md](https://github.com/Krrish1411/KhataGHAR/blob/main/CHANGELOG.md) for complete technical commit history.*
