name: Release — Tag & Publish

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Zip dist for release
        run: |
          cd dist
          zip -r ../khata-ghar-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: khata-ghar-${{ github.ref_name }}.zip
          prerelease: true
          body: |
            ## KhataGHAR ${{ github.ref_name }} — Sovereign Wealth Operating System

            ### 🗂️ Drive UX Overhaul — Google Drive / Native Explorer Parity
            - 🖱️ **Rubber-band Marquee Selection**: Click-drag anywhere on the canvas to select multiple items exactly like Google Drive Desktop.
            - ⌨️ **Ctrl+A / Arrow Keys / Enter / Backspace**: Full keyboard navigation parity with native OS file managers.
            - ✂️ **Multi-item Cut / Copy / Paste** (`Ctrl+X`, `Ctrl+C`, `Ctrl+V`): Move and duplicate files and folders across the Drive.
            - 🎯 **Cut Visual Indicator**: Cut items appear semi-transparent with a dashed border — native OS behavior.
            - 🖱️ **Drag-and-drop Move to Folder**: Drag a selection and drop onto a target folder card to move instantly.
            - 📌 **Fixed Full-Width Selection Action Bar**: Selection mode replaces the entire toolbar row — action buttons scroll horizontally and never clip on mobile.
            - 📋 **Floating Clipboard Paste Bar**: Google Drive–style floating pill at the bottom of the canvas showing clipboard state, item count, and a one-click "Paste here" button.
            - 📱 **Mobile Sidebar Slide-over Drawer**: Full-screen overlay slide-in/out on mobile — no more sidebar-only view.
            - 👆 **Touch-accessible ⋮ Menus**: Options buttons always visible on mobile (hidden-until-hover on desktop).
            - 🔒 **Context Menu Edge Clamping**: Right-click menu never appears off-screen on any device.
            - 📄 **Full Folder Names in List View**: Long folder names no longer truncate in List View.
            - 🖼️ **PDF & Image Preview Fix**: "File data payload is not available" error permanently eliminated.

            ### 🔗 Attachment & Linking Engine
            - Attach any existing Drive file to Transactions, Assets, Liabilities, Goals, People, and Accounts directly from the Hub.
            - Inspector panel shows all linked entries with Unlink buttons and navigation arrows.
            - Linked Entries section only appears when entries are actually linked — no phantom empty UI.

            ### 📊 Storage Meter Fix
            - Storage calculation now correctly sums all payload blob sizes — previously under-reported.

            ### 🐛 Bug Fixes
            - `liabilitys` → `liabilities` typo fixed.
            - VaultContext payload isolation: binary blobs stored under `payload_<docId>` key, no cross-contamination.

            ### 📦 Direct Downloads
            - **Android APK**: Attached below as `KhataGHAR-Android-${{ github.ref_name }}.apk`
            - **Windows**: Setup & Portable `.exe` executables attached below
            - **Linux**: AppImage, Debian `.deb`, and `tar.gz` packages attached below
            - **macOS**: DMG & ZIP packages attached below
            - **Web Static PWA**: `khata-ghar-${{ github.ref_name }}.zip` (extract and open `index.html`)

            *See [CHANGELOG.md](https://github.com/Krrish1411/KhataGHAR/blob/main/CHANGELOG.md) for complete technical commit history.*
