name: Desktop Multi-Platform Build (Win, Linux, Mac)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build Desktop Binaries
        run: npx --yes electron-builder --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KhataGHAR-Desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          retention-days: 14
