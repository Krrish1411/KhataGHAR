name: Desktop Multi-Platform Build (Win, Linux, Mac)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact_name: KhataGHAR-Desktop-Windows
            artifact_path: release/*.exe
          - os: ubuntu-22.04
            platform_flag: --linux
            artifact_name: KhataGHAR-Desktop-Linux
            artifact_path: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            platform_flag: --mac
            artifact_name: KhataGHAR-Desktop-macOS
            artifact_path: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build Desktop Binaries
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

